name: Robô de Notícias - Rádio Luz Gospel

on:
  schedule:
    - cron: "0 9 * * *"    # 06:00 BRT
    - cron: "0 15 * * *"   # 12:00 BRT
    - cron: "0 21 * * *"   # 18:00 BRT
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml google-genai google-auth google-api-python-client

      - env:
          # ===== Blogger =====
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}

          # ===== IA =====
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

          # ===== Configuração do robô =====
          MAX_POSTS_PER_RUN: "2"
          MAX_AGE_DAYS: "4"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          VERBOSE_LOG: "false"

          # ===== Divulgação: Telegram =====
          PROMO_ENABLED: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # ===== Divulgação: Instagram =====
          INSTAGRAM_ENABLED: "true"
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

          # ===== Meta Graph API =====
          META_GRAPH_API_VERSION: "v24.0"

        run: python bot/main.py
