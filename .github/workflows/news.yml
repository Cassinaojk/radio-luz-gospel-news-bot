name: Robô de Notícias - Rádio Luz Gospel

on:
  schedule:
    # 3 execuções por dia (horário UTC — ajuste se quiser)
    - cron: "0 9 * * *"    # 06:00 BRT
    - cron: "0 15 * * *"   # 12:00 BRT
    - cron: "0 21 * * *"   # 18:00 BRT
  workflow_dispatch:       # permite rodar manualmente

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml google-genai google-auth google-api-python-client

      - name: Executar robô
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MAX_POSTS_PER_RUN: "1"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          VERBOSE_LOG: "false"
        run: python main.py
